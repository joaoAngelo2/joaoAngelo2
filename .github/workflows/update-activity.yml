name: Update Activity Log
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Write script
        run: |
          cat > /tmp/gen_activity.py << 'PYEOF'
          import urllib.request, json, re, os
          from datetime import datetime, timezone

          username = "joaoAngelo2"
          token = os.environ["GH_TOKEN"]

          headers = {
            "Authorization": f"token {token}",
            "Accept": "application/vnd.github.v3+json"
          }

          def gh(url):
            req = urllib.request.Request(url, headers=headers)
            return json.loads(urllib.request.urlopen(req).read())

          def time_ago(iso_str):
            dt = datetime.fromisoformat(iso_str.replace("Z", "+00:00"))
            diff = datetime.now(timezone.utc) - dt
            s = int(diff.total_seconds())
            if s < 3600:
              return f"{s // 60}m ago"
            if s < 86400:
              return f"{s // 3600}h ago"
            return f"{s // 86400}d ago"

          EVENT_TYPE = {
            "PushEvent":              ("PUSH",    "#6FF3E9"),
            "PullRequestEvent":       ("PR",      "#A97BFF"),
            "IssuesEvent":            ("ISSUE",   "#f1e05a"),
            "PullRequestReviewEvent": ("REVIEW",  "#3178c6"),
            "WatchEvent":             ("STAR",    "#f1e05a"),
            "ForkEvent":              ("FORK",    "#8b949e"),
            "CreateEvent":            ("CREATE",  "#6FF3E9"),
            "IssueCommentEvent":      ("COMMENT", "#8b949e"),
          }

          def event_message(e):
            t = e["type"]
            repo = e["repo"]["name"].replace(f"{username}/", "")
            p = e.get("payload", {})
            if t == "PushEvent":
              n = len(p.get("commits", []))
              msg = p.get("commits", [{}])[-1].get("message", "")
              msg = msg.split("\n")[0][:35]
              return f"{n} commit{'s' if n != 1 else ''} to {repo}: {msg}"
            if t == "PullRequestEvent":
              pr = p.get("pull_request", {})
              return f"{p.get('action','')} #{pr.get('number','')} {pr.get('title','')[:30]}"
            if t == "IssuesEvent":
              issue = p.get("issue", {})
              return f"{p.get('action','')} #{issue.get('number','')} {issue.get('title','')[:30]}"
            if t == "PullRequestReviewEvent":
              pr = p.get("pull_request", {})
              return f"reviewed #{pr.get('number','')} in {repo}"
            if t == "WatchEvent":
              return f"starred {repo}"
            if t == "ForkEvent":
              return f"forked {repo}"
            if t == "CreateEvent":
              return f"created {p.get('ref_type','')} in {repo}"
            if t == "IssueCommentEvent":
              return f"commented on #{p.get('issue',{}).get('number','')} in {repo}"
            return repo

          def esc(s):
            return str(s).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;").replace('"',"&quot;")

          events = gh(f"https://api.github.com/users/{username}/events/public?per_page=30")

          lines = []
          for e in events:
            if e["type"] not in EVENT_TYPE:
              continue
            label, color = EVENT_TYPE[e["type"]]
            msg = esc(event_message(e))
            ago = esc(time_ago(e["created_at"]))
            lines.append((ago, label, color, msg))
            if len(lines) == 7:
              break

          W = 560
          LINE_H = 26
          PAD_TOP = 52
          PAD_BOT = 16
          H = PAD_TOP + LINE_H * len(lines) + PAD_BOT

          rows = ""
          for i, (ago, label, color, msg) in enumerate(lines):
            y = PAD_TOP + i * LINE_H + 16
            rows += (
              f'  <text x="18"  y="{y}" font-family="JetBrains Mono,monospace" font-size="11" fill="#484f58">{ago}</text>\n'
              f'  <text x="88"  y="{y}" font-family="JetBrains Mono,monospace" font-size="11" font-weight="500" fill="{color}">{label}</text>\n'
              f'  <text x="158" y="{y}" font-family="JetBrains Mono,monospace" font-size="11" fill="#8b949e">{msg}</text>\n'
            )

          svg_parts = [
            f'<svg width="{W}" height="{H}" viewBox="0 0 {W} {H}" xmlns="http://www.w3.org/2000/svg">',
            f'  <rect width="{W}" height="{H}" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>',
            f'  <rect width="{W}" height="34" rx="8" fill="#161b22"/>',
            f'  <rect y="26" width="{W}" height="8" fill="#161b22"/>',
            f'  <rect x="0" y="33" width="{W}" height="1" fill="#30363d"/>',
            f'  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>',
            f'  <circle cx="34" cy="17" r="5" fill="#febc2e"/>',
            f'  <circle cx="50" cy="17" r="5" fill="#28c840"/>',
            f'  <text x="75" y="21" font-family="JetBrains Mono,monospace" font-size="11" fill="#484f58">activity.log — {username}</text>',
            rows,
            '</svg>',
          ]
          svg = "\n".join(svg_parts)

          os.makedirs(".github/cards", exist_ok=True)
          with open(".github/cards/activity.svg", "w") as f:
            f.write(svg)

          with open("README.md", "r") as f:
            readme = f.read()

          img = '<img src=".github/cards/activity.svg" alt="activity log" />\n'
          readme = re.sub(
            r"<!--START_SECTION:activity-->.*?<!--END_SECTION:activity-->",
            f"<!--START_SECTION:activity-->\n{img}<!--END_SECTION:activity-->",
            readme,
            flags=re.DOTALL
          )

          with open("README.md", "w") as f:
            f.write(readme)

          print("Activity SVG gerado.")
          PYEOF

      - name: Run script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 /tmp/gen_activity.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md .github/cards/activity.svg
          git diff --cached --quiet || git commit -m "chore: update activity log"
          git push
