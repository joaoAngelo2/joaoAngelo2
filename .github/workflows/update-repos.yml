name: Update Repo Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find repositories
        id: repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PY'
          import json
          import os
          import urllib.request

          username = "joaoAngelo2"

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "github-actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              repos = json.loads(response.read())

          sections = {
              "react": ["JavaScript", "TypeScript"],
              "typescript": ["TypeScript"],
              "java": ["Java"],
              "android": ["Kotlin", "Java"]
          }

          result = []

          for section, languages in sections.items():
              for repo in repos:
                  if repo.get("fork"):
                      continue

                  if repo.get("language") not in languages:
                      continue

                  result.append({
                      "name": repo["name"],
                      "section": section
                  })

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(
                  "repos=" +
                  json.dumps(json.dumps(result)) +
                  "\n"
              )
          PY

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate repository cards
        env:
          REPOS: ${{ steps.repos.outputs.repos }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PY'
          import json
          import os
          import subprocess

          repos = json.loads(os.environ["REPOS"])

          for repo in repos:
              name = repo["name"]
              section = repo["section"]

              output = f"profile/{section}-{name}.svg"

              print(f"Generating {output}")

              subprocess.run([
                  "gh", "api",
                  f"/repos/joaoAngelo2/{name}"
              ], check=True, stdout=subprocess.DEVNULL)

              subprocess.run([
                  "docker", "run", "--rm",
                  "-e", "PAT_1=" + os.environ["GH_TOKEN"],
                  "ghcr.io/anuraghazra/github-readme-stats:latest"
              ], check=False)
          PY

      - name: Update README
        env:
          REPOS: ${{ steps.repos.outputs.repos }}
        run: |
          python3 << 'PY'
          import json
          import os
          import re

          repos = json.loads(os.environ["REPOS"])

          sections = {
              "react": [],
              "typescript": [],
              "java": [],
              "android": []
          }

          for repo in repos:
              name = repo["name"]
              section = repo["section"]

              path = f"profile/{section}-{name}.svg"

              if os.path.exists(path):
                  sections[section].append(path)

          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          for section, cards in sections.items():

              content = ""

              for path in cards:
                  content += (
                      f'<img src="{path}" width="400" />\n'
                  )

              pattern = (
                  rf"<!--START_SECTION:{section}-->"
                  rf".*?"
                  rf"<!--END_SECTION:{section}-->"
              )

              replacement = (
                  f"<!--START_SECTION:{section}-->\n"
                  f"{content}"
                  f"<!--END_SECTION:{section}-->"
              )

              readme = re.sub(
                  pattern,
                  replacement,
                  readme,
                  flags=re.DOTALL
              )

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "update repo cards"
          git push
