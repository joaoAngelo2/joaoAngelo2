      role="img"
      aria-label="barbie repository card"
    >
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#161b22"/>
          <stop offset="100%" stop-color="#0d1117"/>
